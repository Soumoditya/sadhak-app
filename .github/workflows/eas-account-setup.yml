# One-time: create Sadhak's project in the Expo account that owns EXPO_TOKEN
# and print its project ID. Runs when this file changes on the redesign
# branch. It changes nothing in the repo; the printed ID goes into app.json
# in a follow-up commit.
name: EAS account setup (one-time)

on:
  push:
    branches: [ccr-5f48682a-w1d2yg]
    paths:
      - .github/workflows/eas-account-setup.yml

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Who is the token
        run: |
          eas whoami
      - name: Detach from the old project and create one in this account
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            delete j.expo.owner;
            delete j.expo.extra.eas.projectId;
            delete j.expo.updates.url;
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2) + '\n');
          "
          eas init --non-interactive --force
          echo "----"
          echo "NEW_PROJECT_ID=$(node -p "require('./app.json').expo.extra.eas.projectId")"
          echo "NEW_OWNER=$(node -p "require('./app.json').expo.owner || ''")"
          git diff app.json
